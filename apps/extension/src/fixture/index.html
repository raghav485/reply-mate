<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReplyMate M2 Fixture</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f4f4f5;
      color: #18181b;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
    }
    p {
      color: #52525b;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .input-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box;
    }
    textarea:focus {
      outline: 2px solid #7c6ef0;
      border-color: #7c6ef0;
    }
    .content-editable {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }
    .content-editable:focus {
      outline: 2px solid #7c6ef0;
      border-color: #7c6ef0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ReplyMate generic test fixture</h1>
    <p>
      This page helps test the <strong>GenericSiteAdapter</strong>. Open the ReplyMate extension side panel, then click into one of the text boxes below.
    </p>

    <div class="input-group">
      <label for="basic-textarea">Standard Textarea</label>
      <textarea id="basic-textarea" placeholder="Type a message here to trigger the side panel..."></textarea>
    </div>

    <div class="input-group">
      <label>ContentEditable Element</label>
      <div class="content-editable" contenteditable="true" aria-placeholder="Type here...">
        <div>This is a rich text div. It mimics simpler webmail clients.</div>
      </div>
    </div>
  </div>
</body>
</html>
